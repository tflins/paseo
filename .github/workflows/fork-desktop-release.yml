name: Fork Desktop Release

on:
  push:
    tags:
      - "tflins-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tflins-vX.Y.Z-tflins.N tag to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tflins/paseo'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ONNXRUNTIME_NODE_INSTALL: skip
      # Metro workers need the same heap budget as the upstream ARM64 release job.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate release source
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+-tflins\.[1-9]\d*$/.test(version)) throw new Error('Expected a fork version');
          if (process.env.RELEASE_TAG !== `tflins-v${version}`) throw new Error('Tag and package version differ');
          if (process.arch !== 'arm64') throw new Error('Expected an ARM64 runner');
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          JS
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build desktop artifacts
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(-- --mac dmg zip --arm64 --publish never)
          if [[ -z "$CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(-c.mac.identity=null -c.mac.notarize=false)
            echo 'SIGNING_STATUS=未签名、未公证，仅用于手动安装测试；自动安装更新尚未启用。' >> "$GITHUB_ENV"
          else
            : "${CSC_KEY_PASSWORD:?Missing certificate password}"
            : "${APPLE_ID:?Missing Apple ID}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing Apple app password}"
            : "${APPLE_TEAM_ID:?Missing Apple team ID}"
            echo 'SIGNING_STATUS=已配置 Apple 签名和公证。' >> "$GITHUB_ENV"
          fi
          npm run build:desktop "${args[@]}"
      - name: Validate code and packaging
        run: |
          npm run typecheck
          npm run lint
          npm exec --workspace=@getpaseo/desktop -- vitest run src/daemon/desktop-packaging.test.ts --bail=1
          npm exec --workspace=@getpaseo/app -- vitest run native-release-version.test.ts app.config.test.ts --bail=1
          node packages/desktop/e2e/packaged-app-smoke.js --app "$PWD/packages/desktop/release/mac-arm64/Paseo.app"
      - name: Verify update artifacts
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const yaml = require('js-yaml');
          const root = 'packages/desktop/release/';
          const config = yaml.load(fs.readFileSync(root + 'mac-arm64/Paseo.app/Contents/Resources/app-update.yml', 'utf8'));
          if (config.owner !== 'tflins' || config.repo !== 'paseo' || config.channel !== 'latest') throw new Error('Unexpected update source');
          const manifest = yaml.load(fs.readFileSync(root + 'latest-mac.yml', 'utf8'));
          const version = process.env.RELEASE_VERSION;
          if (manifest.version !== version) throw new Error('Unexpected manifest version');
          for (const extension of ['dmg', 'zip']) {
            const name = `Paseo-${version}-arm64.${extension}`;
            const entry = manifest.files.find(file => file.url === name);
            const data = fs.readFileSync(root + name);
            if (!entry || data.length !== entry.size || crypto.createHash('sha512').update(data).digest('base64') !== entry.sha512) throw new Error(`Invalid asset: ${name}`);
            fs.accessSync(root + name + '.blockmap');
          }
          JS
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paseo-${{ env.RELEASE_VERSION }}-mac-arm64
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest-mac.yml
          if-no-files-found: error
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node -e "if (!require(process.argv[1]).isDraft) throw new Error('Refusing to replace a published release')" "$RUNNER_TEMP/existing-release.json"
          else
            printf 'Paseo 定制版 %s\n\n%s\n\n更新源：tflins/paseo。此版本提供 macOS Apple Silicon 安装包。\n' "$RELEASE_VERSION" "$SIGNING_STATUS" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Paseo $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          root=packages/desktop/release
          gh release upload "$RELEASE_TAG" --clobber \
            "$root/Paseo-$RELEASE_VERSION-arm64.dmg" \
            "$root/Paseo-$RELEASE_VERSION-arm64.dmg.blockmap" \
            "$root/Paseo-$RELEASE_VERSION-arm64.zip" \
            "$root/Paseo-$RELEASE_VERSION-arm64.zip.blockmap" \
            "$root/latest-mac.yml"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
